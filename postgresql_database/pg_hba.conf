# Repository reference file.
# The running container uses /var/lib/postgresql/data/pg_hba.conf (generated/managed by startup.sh).
#
# If you need to customize authentication rules, update startup.sh generation logic
# or mount this file into the data directory at runtime.

# Local (unix socket) connections
local   all             all                                     trust

# Localhost TCP connections
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Container / in-cluster connections
host    all             all             0.0.0.0/0               scram-sha-256
